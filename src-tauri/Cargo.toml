[package]
name = "daymark"
version = "0.1.0"
description = "拾序 Daymark — 课程与事项"
edition = "2021"
authors = ["Daymark"]

[lib]
name = "daymark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
